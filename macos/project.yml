# The Potluck app for macOS: a menu-bar item and native windows around Potluck itself.
# Generate the Xcode project with:  xcodegen generate   (in this folder). build.sh builds it
# and puts the Potluck program inside.
name: PotluckMac
options:
  bundleIdPrefix: io.github.fourcher
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.10.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Potluck:
    type: application
    platform: macOS
    sources:
      - path: Potluck
    settings:
      base:
        PRODUCT_NAME: Potluck
        PRODUCT_BUNDLE_IDENTIFIER: io.github.fourcher.potluck.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Potluck
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Potluck connects to your other computers on this network to share AI models between them.
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
