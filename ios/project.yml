# The Potluck iPhone app. Generate the Xcode project with:  xcodegen generate
# (run inside this folder). Then open Potluck.xcodeproj, pick your team under
# Signing & Capabilities, and run it on your iPhone.
name: Potluck
options:
  bundleIdPrefix: io.github.fourcher
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.11.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Potluck:
    type: application
    platform: iOS
    sources:
      - path: Potluck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.fourcher.potluck
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Potluck
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSCameraUsageDescription: Potluck uses the camera to scan the pairing code shown on your computer.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Potluck connects to your own computer on your home network to chat with the AI model running there.
    entitlements:
      path: Potluck/Potluck.entitlements
      properties:
        aps-environment: development # Apple push alerts for questions from tasks (apns.go)
    info:
      path: Potluck/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: io.github.fourcher.potluck.pair
            CFBundleURLSchemes: [potluck]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
  PotluckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PotluckUITests
    dependencies:
      - target: Potluck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.fourcher.potluck.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Potluck
schemes:
  Potluck:
    build:
      targets:
        Potluck: all
    test:
      targets:
        - PotluckUITests
