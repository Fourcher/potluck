<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Potluck chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23c2410c'/%3E%3Ccircle cx='10' cy='14' r='3.4' fill='%23fff'/%3E%3Ccircle cx='22' cy='14' r='3.4' fill='%23fff'/%3E%3Ccircle cx='16' cy='22' r='3.4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="chat.css">
</head>
<body>
<div id="shell">
  <aside id="side" aria-label="Conversations">
    <div class="side-top">
      <div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span><b>Potluck</b></div>
      <button class="icon" id="side-close" title="Hide sidebar" aria-label="Hide sidebar"></button>
    </div>
    <button class="new" id="new-chat"><span class="ic" data-ic="plus"></span>New chat<kbd id="kbd-new"></kbd></button>
    <label class="search"><span class="ic" data-ic="search"></span><input id="chat-search" type="search" placeholder="Search chats" autocomplete="off"></label>
    <nav id="project-list" aria-label="Projects"></nav>
    <nav id="chat-list" aria-label="Chat history"></nav>
    <div class="side-bottom">
      <button class="status" id="cluster-chip" title="What is running"></button>
      <div class="row">
        <a class="link" id="panel-link" target="_blank" rel="noopener" hidden>Control panel</a>
        <button class="link" id="open-settings">Settings</button>
      </div>
    </div>
  </aside>
  <main id="main">
    <header id="top">
      <button class="icon" id="side-open" title="Show sidebar" aria-label="Show sidebar"></button>
      <h1 id="chat-title" title="Click to rename"></h1>
      <div class="grow"></div>
      <button class="icon" id="chat-star" title="Star this chat" aria-label="Star this chat"></button>
      <button class="icon" id="chat-menu" title="More" aria-label="More"></button>
    </header>
    <div id="banner" hidden></div>
    <section id="thread" aria-live="polite"></section>
    <footer id="composer-wrap">
      <div id="drop-hint" hidden>Drop files to attach them</div>
      <div id="slash" class="menu" hidden role="listbox"></div>
      <form id="composer" autocomplete="off">
        <div id="chips"></div>
        <textarea id="input" rows="1" placeholder="Message Potluck" aria-label="Message"></textarea>
        <div class="tools">
          <button type="button" class="icon" id="attach" title="Attach files or a folder" aria-label="Attach"></button>
          <button type="button" class="pillbtn" id="perm" title="What the model may do with your folder"></button>
          <button type="button" class="pillbtn" id="agent" title="Agent mode: let the model run commands and drive apps on this computer" hidden></button>
          <button type="button" class="pillbtn" id="think" title="Let the model think before answering (slower)"></button>
          <div class="grow"></div>
          <button type="button" class="ring" id="usage" title="Usage" aria-label="Usage"></button>
          <button type="button" class="pillbtn" id="model" title="Choose a model"></button>
          <button type="button" class="icon" id="mic" title="Dictate" aria-label="Dictate"></button>
          <button type="submit" class="send" id="send" title="Send" aria-label="Send"></button>
        </div>
      </form>
      <p class="fine" id="fine"></p>
    </footer>
  </main>
  <aside id="preview" hidden aria-label="Preview">
    <div class="preview-top"><b id="preview-title">Preview</b><div class="grow"></div><button class="icon" id="preview-close" title="Close preview" aria-label="Close preview"></button></div>
    <iframe id="preview-frame" sandbox="allow-scripts" title="Preview"></iframe>
  </aside>
</div>
<div id="pop" class="menu" hidden></div>
<div id="modal" hidden><div class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-input" multiple hidden>
<input type="file" id="dir-input" webkitdirectory hidden>
<script src="md.js"></script>
<script src="store.js"></script>
<script src="extract.js"></script>
<script src="chat.js"></script>
</body>
</html>
