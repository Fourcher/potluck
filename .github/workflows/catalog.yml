# Refreshes catalog/models.json once a day from Hugging Face's public lists, so Potluck shows
# new and trending models without an update. Commits only when a list changed.
name: Model catalog
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/catalog.py
      - name: Commit when it changed
        run: |
          if git diff --quiet catalog/models.json; then echo "no change"; exit 0; fi
          git config user.name "potluck-catalog"
          git config user.email "potluck-catalog@users.noreply.github.com"
          git add catalog/models.json
          git commit -m "Daily model catalog"
          git push
